# Builds the Android release AAB (for the Play Store) and APK (to install on a phone).
#
# Runs when:
#   - code is pushed to main         -> files attached to the workflow run
#   - a tag like v1.0.0 is pushed    -> files also attached to a GitHub Release
#   - started by hand (Actions tab -> Android Release -> Run workflow)
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   ENV_PRODUCTION           contents of your .env.production (optional, else .env.example is used)
#   ANDROID_KEYSTORE_BASE64  base64 of your upload keystore (optional, else debug key is used)
#   ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create GitHub Releases on tags

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENVFILE: .env.production
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Create .env.production
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
        run: |
          if [ -n "$ENV_PRODUCTION" ]; then
            echo "$ENV_PRODUCTION" > .env.production
          else
            echo "::warning::ENV_PRODUCTION secret not set, using .env.example"
            sed -e 's/^APP_ENV=.*/APP_ENV=production/' -e 's/^ENABLE_API_LOGS=.*/ENABLE_API_LOGS=false/' .env.example > .env.production
          fi

      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            {
              echo "RELEASE_STORE_FILE=release.keystore"
              echo "RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::No keystore secret. Signed with the debug key: fine for testing, not for the Play Store."
          fi

      - name: Build AAB and APK
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/app-${VERSION_NAME}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/app-${VERSION_NAME}.apk"
          ls -lh dist

      - name: Upload build files
        uses: actions/upload-artifact@v5
        with:
          name: android-release-${{ env.VERSION_NAME }}
          path: dist/*
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.keystore
